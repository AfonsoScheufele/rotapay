services:
  postgres:
    image: postgres:16-alpine
    container_name: rotapay-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rotapay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rotapay}
      POSTGRES_DB: ${POSTGRES_DB:-rotapay}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rotapay}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rotapay-redis
    ports:
      - "6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
