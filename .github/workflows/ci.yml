name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rotapay
          POSTGRES_PASSWORD: rotapay
          POSTGRES_DB: rotapay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rotapay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rotapay:rotapay@localhost:5432/rotapay
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-rotapay
      ENVIRONMENT: development
      MP_ACCESS_TOKEN: ""
      MP_WEBHOOK_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Migrate
        run: alembic upgrade head
      - name: Pytest
        run: pytest -q
